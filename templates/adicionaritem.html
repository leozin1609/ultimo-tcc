<!DOCTYPE html>
<html lang="en">
<head>      
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Adicionar Novo Item</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="static/style.css">
</head>
<body id="fundoadm" class="p-5">
    <div class="container bg-white p-4 rounded shadow" style="max-width: 500px;">
        <h2 class="mb-4">Adicionar Novo Produto</h2>

        <form action="/salvar_item" method="POST" enctype="multipart/form-data">
            <div class="mb-3">
                <label class="form-label">Nome do Produto:</label>
                <input type="text" class="form-control" name="nome" placeholder="Ex: Multímetro" required>
            </div>

            <div class="mb-3">
                <label class="form-label">Quantidade em Estoque:</label>
                <input type="number" class="form-control" name="quantidade_estoque" value="1" min="0" required>
            </div>

            <div class="mb-3">
                <label class="form-label">Descrição:</label>
                <textarea class="form-control" name="descricao" placeholder="Digite a descrição"></textarea>
            </div>

            <div class="mb-3">
                <label class="form-label">Preço (R$):</label>
                <input type="number" step="0.01" class="form-control" name="preco" placeholder="0.00" required>
            </div>

            <div class="mb-3">
                <label class="form-label">Categoria:</label>
                <input type="text" class="form-control" name="categoria" placeholder="Ex: Elétrica, Ferramentas" required>
            </div>

            <div class="mb-3">
    <label for="foto" class="form-label">Link da Foto do Produto:</label>
    <input type="url" class="form-control" id="foto" name="foto" placeholder="https://exemplo.com/imagem.jpg" required>
    
    </div>
</div>

            <button type="submit" class="btn btn-primary w-100 mb-2">Salvar no Banco</button>
            <a href="/home" class="btn btn-secondary w-100">Voltar para Home</a>
        </form>
    </div>
</body>
</html>
