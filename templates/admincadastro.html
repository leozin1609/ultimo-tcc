<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="static/style.css">
    <link rel="icon" href="static/cantinho.png">
</head>
    <body id="fundodev">

        <div class="container mt-5">
            <div class="row justify-content-center">
                <div class="col-md-6">
                    <div class="card shadow p-4">
                        <h3 class="text-center mb-4 text-primary">Painel de Cadastro Admin</h3>

                        <form method="POST" action="/admincadastro">
                            
                            <div class="mb-3">
                                <label for="email" class="form-label">Email do Usuário:</label>
                                <input type="email" class="form-control" id="email" name="email" placeholder="Digite o email" required>
                            </div>

                            <div class="mb-3">
                                <label for="senha" class="form-label">Senha:</label>
                                <input type="password" class="form-control" id="senha" name="senha" placeholder="Digite a senha" required>
                            </div>

                            <div class="mb-3">
                                <label class="form-label">Tipo de Acesso:</label>
                                <select name="tipo" class="form-select" required>
                                    <option value="" selected disabled>Selecione...</option>
                                    <option value="usuario">Usuário Comum</option>
                                    <option value="admin">Administrador</option>
                                </select>
                            </div>

                            <div class="d-grid gap-2 mt-4">
                                <button type="submit" class="btn btn-primary btn-lg">Cadastrar</button>
                                <a href="/admin" class="btn btn-outline-secondary">Voltar ao Painel Admin</a>
                            </div>

                        </form>
                    </div>
                </div>
            </div>
        </div>

    </body>
    </html>
