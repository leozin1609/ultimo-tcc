<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro Senai</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

    <link rel="stylesheet" href="static/style.css">
    <link rel="icon" href="static/cantinho.png">
</head>

<body id="yan">

    <p id="titulo">Coloque suas credenciais</p>

    <img id="Senai" src="static/image.png" width="400" height="250">
    <img id="roger" src="static/roger.png" width="400" height="250">

    <div id="email1">

        <form action="/" method="POST">

            <div class="mb-3">
                <label for="emailInput" class="form-label">Usuário</label>
                <input
                    type="email"
                    class="form-control"
                    id="emailInput"
                    name="email"
                    placeholder="Digite seu usuário"
                    required>
            </div>

            <div class="mb-3">
                <label for="senhaInput" class="form-label">Senha</label>
                <input
                    type="password"
                    class="form-control"
                    id="senhaInput"
                    name="senha"
                    placeholder="Digite sua senha"
                    required>
            </div>

            {% if erro %}
            <div id="erroLogin" style="color:red; margin-bottom:10px;">
                Usuário ou senha inválidos!
            </div>
            {% endif %}

            <button type="submit" class="btn btn-secondary btn-lg">
                Entrar
            </button>

        </form>

    </div>

</body>

</html>
